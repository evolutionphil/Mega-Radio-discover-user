<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tv-styles.css" id="tv-styles">
    <title>Radio Mega - TV</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- LG webOS SDK (loaded only on LG TVs) -->
    <script type="text/javascript" src="/webOSTVjs-1.2.0/webOSTV.js"></script>

    <!-- TV Platform Detection -->
    <script type="text/javascript" src="/js/platform-detect.js"></script>

    <!-- TV Spatial Navigation (must load before remote keys) -->
    <script type="text/javascript" src="/js/tv-spatial-navigation.js"></script>

    <!-- TV Remote Control Keys -->
    <script type="text/javascript" src="/js/tv-remote-keys.js"></script>

    <!-- TV Audio Player -->
    <script type="text/javascript" src="/js/tv-audio-player.js"></script>

    <!-- Polyfills for older Samsung/LG TV browsers (MUST load before React) -->
    <script type="text/javascript" src="/js/polyfills.js"></script>

    <!-- React App (Vite entry) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
